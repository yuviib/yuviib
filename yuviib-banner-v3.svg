<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250">
    <defs>
        <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </radialGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <style>
            @keyframes pulse {
                0% { opacity: 0.8; }
                50% { opacity: 1.0; text-shadow: 0 0 20px #38bdf8; }
                100% { opacity: 0.8; }
            }
            .title {
                font-family: 'Segoe UI', system-ui, sans-serif;
                font-weight: 800;
                font-size: 54px;
                fill: #ffffff;
                animation: pulse 3s infinite;
                filter: url(#glow);
            }
            .subtitle {
                font-family: 'Segoe UI', system-ui, sans-serif;
                font-weight: 600;
                font-size: 22px;
                fill: #10b981;
                letter-spacing: 4px;
            }
            .grid {
                stroke: #334155;
                stroke-width: 1;
                opacity: 0.4;
            }
        </style>
    </defs>
    
    <rect width="100%" height="100%" fill="url(#bgGradient)"/>
    
    <!-- Tech Grid Background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="none" class="grid"/>
        <path d="M 40 0 L 0 0 0 40" fill="none" class="grid"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid)"/>

    <text x="50%" y="45%" text-anchor="middle" class="title">YUVRAJ BAINS</text>
    <text x="50%" y="65%" text-anchor="middle" class="subtitle">AI &amp; SOFTWARE ENGINEER</text>
</svg>