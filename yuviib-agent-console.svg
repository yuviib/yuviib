<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200">
    <defs>
        <style>
            .window {
                fill: #0d1117;
                stroke: #334155;
                stroke-width: 2;
                rx: 10;
                ry: 10;
            }
            .header {
                fill: #161b22;
            }
            .dot-red { fill: #ef4444; }
            .dot-yellow { fill: #f59e0b; }
            .dot-green { fill: #10b981; }
            .title {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                font-size: 12px;
                fill: #8b949e;
                font-weight: 500;
            }
            .text {
                font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
                font-size: 13px;
                fill: #10b981; /* Emerald green */
            }
            .text-cyan { fill: #38bdf8; }
            .text-purple { fill: #a78bfa; }
            
            /* Animations */
            .line { opacity: 0; animation: fadeIn 0.1s forwards; }
            .l1 { animation-delay: 0.5s; }
            .l2 { animation-delay: 1.5s; }
            .l3 { animation-delay: 2.5s; }
            .l4 { animation-delay: 3.5s; }
            .l5 { animation-delay: 4.5s; }
            
            @keyframes fadeIn {
                to { opacity: 1; }
            }
            @keyframes blink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0; }
            }
            .cursor {
                animation: blink 1s step-end infinite;
            }
        </style>
    </defs>

    <!-- Window Background -->
    <rect class="window" x="1" y="1" width="458" height="198"/>
    
    <!-- Window Header -->
    <path class="header" d="M 1 11 Q 1 1 11 1 L 449 1 Q 459 1 459 11 L 459 30 L 1 30 Z"/>
    <circle class="dot-red" cx="20" cy="15" r="5"/>
    <circle class="dot-yellow" cx="38" cy="15" r="5"/>
    <circle class="dot-green" cx="56" cy="15" r="5"/>
    <text x="230" y="20" text-anchor="middle" class="title">yuvraj@agent-console:~</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 60)">
        <text y="0" class="text line l1"><tspan class="text-cyan">[SYSTEM]</tspan> Initializing LangGraph Swarm...</text>
        <text y="25" class="text line l2"><tspan class="text-purple">[STATUS]</tspan> Yuvraj-Agent online 🟢</text>
        <text y="50" class="text line l3"><tspan class="text-cyan">[TASK]</tspan> Optimizing enterprise data pipelines...</text>
        <text y="75" class="text line l4"><tspan class="text-cyan">[TASK]</tspan> Deploying vLLM microservices...</text>
        <text y="100" class="text line l5">> <tspan class="cursor">█</tspan></text>
    </g>
</svg>
